name: Compilar APK Sem Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema (Android SDK/NDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-doc gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 openjdk-17-jdk unzip zip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Configurar o SDK do Android automaticamente
        run: |
          mkdir -p ~/.buildozer/android/platform
          # Força o buildozer a aceitar os termos de licença do SDK automaticamente em modo não-interativo
          
      - name: Compilar o APK
        run: |
          # O comando 'yes' responde automaticamente sim para as licenças do Android SDK que aparecerem na tela
          yes | buildozer android debug

      - name: Enviar o APK gerado para download
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-kivy-apk
          path: bin/*.apk
